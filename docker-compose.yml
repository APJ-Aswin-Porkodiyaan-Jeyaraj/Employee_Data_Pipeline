services:

  postgres:
    image: postgres:16

    container_name: postgres_container

    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app_network


  python_app:
    build: .

    container_name: python_container

    depends_on:
      - postgres

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mydatabase
      DB_USER: myuser
      DB_PASSWORD: mypassword

    networks:
      - app_network


volumes:
  postgres_data:


networks:
  app_network:
    driver: bridge